<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block head %}{% endblock %}
<title>{% block title %}Backups{% endblock %} · Backup Manager</title>
<style>
  :root { --ok:#1a7f37; --bad:#c62828; --run:#0b62c4; --mute:#666; --line:#ddd; --bg:#fafafa; }
  @media (prefers-color-scheme: dark) { :root { --ok:#4cc46a; --bad:#ff6b6b; --run:#5aa9ff; --mute:#aaa; --line:#333; --bg:#161616; } body { color:#eee; } a { color:#7ab7ff; } input, textarea, select { background:#222; color:#eee; border-color:#444; } }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: var(--bg); }
  header { padding: .8rem 1.5rem; border-bottom: 1px solid var(--line); display:flex; gap:1.5rem; align-items:center; }
  header a { text-decoration:none; font-weight:600; }
  main { padding: 1rem 1.5rem 3rem; max-width: 1200px; }
  table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--mute); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  code, pre { font: 13px/1.4 ui-monospace, monospace; }
  pre.log { background:#111; color:#ddd; padding:1rem; overflow:auto; max-height:70vh; white-space: pre-wrap; word-break: break-all; }
  .status { font-weight: 600; white-space: nowrap; }
  .ok { color: var(--ok); } .failed { color: var(--bad); } .running, .queued { color: var(--run); } .never { color: var(--mute); }
  .mute { color: var(--mute); font-size: .9em; }
  .flash { padding:.6rem .9rem; border-left: 4px solid var(--run); background: rgba(90,169,255,.1); margin-bottom: 1rem; }
  .error { padding:.6rem .9rem; border-left: 4px solid var(--bad); background: rgba(255,80,80,.1); margin-bottom: 1rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; min-width: 120px; }
  .bar > div { height: 100%; background: var(--run); border-radius: 3px; }
  .bar.full > div { background: var(--bad); }
  form.inline { display:inline; }
  button, .button { font: inherit; padding: .3rem .8rem; cursor: pointer; border:1px solid var(--line); border-radius:4px; background:transparent; color:inherit; text-decoration:none; }
  button.primary { background: var(--run); color: #fff; border-color: var(--run); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  label { display:block; font-weight:600; margin-top: 1rem; }
  label .mute { font-weight: normal; }
  input[type=text], input[type=number], input[type=time], textarea, select { font: inherit; padding:.35rem .5rem; border:1px solid #bbb; border-radius:4px; width: 100%; max-width: 640px; box-sizing: border-box; }
  input[type=number], input[type=time] { width: 8rem; }
  textarea { font-family: ui-monospace, monospace; font-size: 13px; }
  fieldset { border:1px solid var(--line); max-width: 640px; margin-top: 1rem; }
</style>
</head>
<body>
<header><a href="{{ url_for('dashboard') }}">Backup Manager</a><a href="{{ url_for('new_job') }}">+ New job</a></header>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
